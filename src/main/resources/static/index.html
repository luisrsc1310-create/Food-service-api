<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Food Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css?v=2">

</head>


<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Modal title</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <span>Are you sure you want to delete it?</span>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                <button type="button" class="btn btn-primary" id="deleteButton">Yes</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="updateModal" tabindex="-1" aria-labelledby="updateModal" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <input type="hidden" id="idToDelete">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Food Update</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="" id="foodUpdate-form">
                    <div class="mb-3">
                        <input type="hidden" id="idToUpdate">
                        <label for="nameToUpdate" class="form-label">Name of Food</label>
                        <input type="text" class="form-control" id="nameToUpdate" aria-describedby="nameToHelp">
                        <div id="nameToHelp" class="form-text">can't be null or blank</div>
                    </div>

                    <div class="mb-3">
                        <label for="priceToUpdate" class="form-label">Price of Food</label>
                        <input type="number" class="form-control" id="priceToUpdate" aria-describedby="priceToHelp">
                    </div>
                    <div class="input-group mb-3">
                        <label class="input-group-text" for="typeSelectUpdate">Options</label>
                        <select class="form-select" id="typeSelectUpdate">
                            <option value="0">LUNCH</option>
                            <option value="1">DRINKS</option>
                            <option value="2">DESSERTS</option>
                        </select>
                    </div>
                    <div class="input-group mb-3">
                        <label for="categorySelectUpdate" class="input-group-text">Options</label>
                        <select class="form-select" id="categorySelectUpdate">
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<body>

<div class="container">

    <h1 class="mt-5 text-center">🍔 Food Manager</h1>

    <form id="food-form">
        <div class="mb-3">
            <label for="name" class="form-label">Name of Food</label>
            <input type="text" class="form-control" id="name" aria-describedby="nameHelp">
            <div id="nameHelp" class="form-text">can't be null or blank</div>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price of Food</label>
            <input type="number" class="form-control" id="price" aria-describedby="priceHelp">
        </div>
        <div class="mb-3">

            <div class="input-group mb-3">
                <label class="input-group-text" for="type">Options</label>
                <select class="form-select categorySelect" id="type">
                    <option value="0">LUNCH</option>
                    <option value="1">DRINKS</option>
                    <option value="2">DESSERTS</option>
                </select>
            </div>
            <div class="input-group mb-3">
                <label for="categorySelect" class="input-group-text">Options</label>
                    <select class="form-select categorySelect" id="categorySelect">
                    </select>
            </div>

        </div>

        <button type="submit" class="btn btn-primary">Submit</button>


    </form>

    <h2 class="mt-5">Food List</h2>


    <div class="container-lg table-container">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">Number</th>
                <th scope="col">Name</th>
                <th scope="col">Price</th>
                <th scope="col">Category</th>
                <th scope="col">Options</th>
            </tr>
            </thead>
            <tbody class="table-group-dividir" id="food-list">

            </tbody>
        </table>
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="script.js"></script>

</body>
</html>
